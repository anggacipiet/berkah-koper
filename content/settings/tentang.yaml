heading: Mengapa Memilih Berkah Koper?
description: >-
  Hadirkan ketenangan pikiran disetiap langkah ibadah Anda.

  Fokuslah pada kekhusyukan pendekatan diri kepada Allah SWT,

  dan biarkan koleksi perlengkapan dari Berkah Koper menjaga keamanan barang
  bawaan Anda,

  mulai dari keberangkatan hingga kepulangan kembali ke tanah air.
items:
  - icon: 🏆
    title: Kualitas Premium
    desc: >-
      Tersedia bahan pilihan (ABS, Polycarbonate, dan Polypropylene) yang kuat
      dan tahan lama.
  - icon: 🧳
    title: Desain Fungsional
    desc: >-
      Ruang penyimpanan optimal untuk pakaian ihram dan perlengkapan pribadi.
  - icon: 🔒
    title: Perlindungan Maksimal
    desc: >-
      Kunci kombinasi 3-digit dan konstruksi kokoh untuk barang berharga.
  - icon: 🛞
    title: Ringan Dan Nyaman
    desc: >-
      Dilengkapi 360 silent wheels untuk mobilitas tinggi.
