description: "Koper Polypropylene (PP) adalah koper hardcase yang terbuat dari plastik termoplastik berkualitas tinggi sehingga bersifat tangguh, lentur, anti pecah, dan tahan banting.\n\n* Ukuran 20 Inch (Kabin Pesawat):\n\t• Dimensi rata-rata: ± 34–37 cm x 20–23 cm x 47–50 cm (Belum termasuk roda)\n\t• Berat kosong: ± 2.9 kg\n* Ukuran 24 Inch (Bagasi):\n\t• Dimensi rata-rata: ± 41–44 cm x 23–27 cm x 57–60 cm (Belum termasuk roda)\n\t• Berat kosong: ± 3.5 – 4 kg\n* Ukuran 28 Inch (Bagasi Besar / Expandable):\n\t• Dimensi rata-rata: ± 48–49 cm x 29–32 cm x 69–70 cm\n\t• Berat kosong: ± 4.8 – 4.85 kg"
