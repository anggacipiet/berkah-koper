features:
  - >-
    Bahan: 100% Polypropylene (PP) yang ringan (ultra lightweight) dan tidak
    mudah retak saat terbentur.
  - >-
    Roda: Roda ganda berputar 360 derajat (konfigurasi 4x2) dan dilapisi karet
    agar lebih senyap saat ditarik.
  - >-
    Keamanan: Dilengkapi kunci kombinasi 3 angka acak (TSA lock atau kunci
    tanam).
  - >-
    Interior: Dilengkapi tali pengaman (strap), kantong jaring/mesh, serta slot
    tambahan untuk perlengkapan kecil seperti skincare.
